<dialog id="citation-modal" class="dmod-modal" aria-labelledby="citation-modal-title">
    <div class="dmod-modal-box">
        <div class="dmod-modal-header">
            <span id="citation-modal-title" class="dmod-modal-title">Cite</span>
            <button type="button" class="dmod-modal-close" data-modal-action="close" aria-label="Close">
                <iron-icon icon="icons:close"></iron-icon>
            </button>
        </div>
        <textarea id="citation-modal-text" class="dmod-modal-text" rows="6" readonly="readonly"></textarea>
        <div class="dmod-modal-actions">
            <button type="button" class="dmod-modal-copy" data-modal-action="copy">
                <iron-icon icon="icons:content-copy"></iron-icon>
                <span>Copy</span>
            </button>
        </div>
    </div>
</dialog>
